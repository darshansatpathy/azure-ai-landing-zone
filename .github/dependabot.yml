version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories:
      - "/terraform/modules/*"
      - "/terraform/envs/*"
      - "/terraform/bootstrap"
    schedule:
      interval: weekly
    # One pull request for all Terraform updates, so modules and environments never drift apart.
    groups:
      terraform:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # A major azurerm upgrade changes resources across every module and needs a planned migration, not a
    # single-module version bump. Raise it by hand when ready.
    ignore:
      - dependency-name: "hashicorp/azurerm"
        update-types: ["version-update:semver-major"]

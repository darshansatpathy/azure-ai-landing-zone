version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories:
      - "/terraform/modules/*"
      - "/terraform/envs/*"
      - "/terraform/bootstrap"
    schedule:
      interval: weekly
